<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Panna Cotta AR</title>

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .guide {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 10;
            padding: 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #633b38;
            text-align: center;
            font: 14px/1.5 sans-serif;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="guide" id="guide">
        Hướng camera vào thẻ có chữ AR
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="alpha: true; antialias: true"
        arjs="sourceType: webcam; debugUIEnabled: false;"
    >
        <a-assets timeout="20000">
            <img
                id="cake"
                src="./assets/asset.png"
                crossorigin="anonymous"
            >
        </a-assets>

        <a-marker
            id="cake-marker"
            type="pattern"
            url="./assets/marker.patt"
        >
            <a-plane
                position="0 0.02 0"
                rotation="-90 0 0"
                width="1"
                height="1"
                material="
                    shader: flat;
                    src: #cake;
                    color: #ffffff;
                    transparent: true;
                    alphaTest: 0.05;
                    side: double;
                "
            ></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.querySelector("#cake-marker");
        const guide = document.querySelector("#guide");
        const cake = document.querySelector("#cake");

        marker.addEventListener("markerFound", function () {
            guide.textContent = "Đã nhận diện thẻ Panna Cotta";
        });

        marker.addEventListener("markerLost", function () {
            guide.textContent = "Hướng camera vào thẻ có chữ AR";
        });

        cake.addEventListener("error", function () {
            guide.textContent = "Không tải được ảnh bánh: assets/asset.png";
        });
    </script>
</body>
</html>
